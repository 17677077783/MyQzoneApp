name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/myqzoneapp
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = \"MyQzoneApp\"" >> settings.gradle

          # 2. build.gradle
          echo "buildscript {" > build.gradle
          echo "    repositories { google(); mavenCentral() }" >> build.gradle
          echo "    dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }" >> build.gradle
          echo "}" >> build.gradle

          # 3. app/build.gradle
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android {" >> app/build.gradle
          echo "    namespace 'com.example.myqzoneapp'" >> app/build.gradle
          echo "    compileSdk 34" >> app/build.gradle
          echo "    defaultConfig {" >> app/build.gradle
          echo "        applicationId \"com.example.myqzoneapp\"" >> app/build.gradle
          echo "        minSdk 24" >> app/build.gradle
          echo "        targetSdk 33" >> app/build.gradle
          echo "        versionCode 1" >> app/build.gradle
          echo "        versionName \"1.0\"" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

          # 4. AndroidManifest.xml
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>" > app/src/main/AndroidManifest.xml
          echo "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">" >> app/src/main/AndroidManifest.xml
          echo "    <uses-permission android:name=\"android.permission.INTERNET\" />" >> app/src/main/AndroidManifest.xml
          echo "    <application android:label=\"MyQzoneApp\" android:theme=\"@android:style/Theme.DeviceDefault\">" >> app/src/main/AndroidManifest.xml
          echo "        <activity android:name=\".MainActivity\" android:exported=\"true\">" >> app/src/main/AndroidManifest.xml
          echo "            <intent-filter>" >> app/src/main/AndroidManifest.xml
          echo "                <action android:name=\"android.intent.action.MAIN\" />" >> app/src/main/AndroidManifest.xml
          echo "                <category android:name=\"android.intent.category.LAUNCHER\" />" >> app/src/main/AndroidManifest.xml
          echo "            </intent-filter>" >> app/src/main/AndroidManifest.xml
          echo "        </activity>" >> app/src/main/AndroidManifest.xml
          echo "    </application>" >> app/src/main/AndroidManifest.xml
          echo "</manifest>" >> app/src/main/AndroidManifest.xml

          # 5. MainActivity.java (纯文字版，测试Android 17能否运行)
          echo "package com.example.myqzoneapp;" > app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "import android.app.Activity;" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "import android.os.Bundle;" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "import android.widget.TextView;" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "public class MainActivity extends Activity {" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "    @Override" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "    protected void onCreate(Bundle savedInstanceState) {" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "        super.onCreate(savedInstanceState);" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "        TextView tv = new TextView(this);" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "        tv.setText(\"App启动成功！没有闪退！\\n\\n下一步我们绕过系统限制，实现直接下载相册。\");" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "        tv.setTextSize(18);" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "        tv.setPadding(50, 50, 50, 50);" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "        setContentView(tv);" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "    }" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java
          echo "}" >> app/src/main/java/com/example/myqzoneapp/MainActivity.java

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk