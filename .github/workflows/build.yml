name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android Project Files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/example/myqzoneapp
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          rootProject.name = "MyQzoneApp"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myqzoneapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myqzoneapp"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
              <application android:label="MyQzoneApp" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/myqzoneapp/MainActivity.java
          package com.example.myqzoneapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.Gravity;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      FrameLayout layout = new FrameLayout(this);
                      
                      webView = new WebView(this);
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setUserAgentString("Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Mobile Safari/537.36");
                      
                      webView.setWebViewClient(new WebViewClient());
                      webView.loadUrl("https://user.qzone.qq.com/");
                      
                      Button btn = new Button(this);
                      btn.setText("一键下载所有相册");
                      btn.setAlpha(0.8f);
                      btn.setOnClickListener(v -> {
                          String cookies = CookieManager.getInstance().getCookie("https://user.qzone.qq.com");
                          if (cookies == null || !cookies.contains("p_skey")) {
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("未登录")
                                  .setMessage("请先在上方网页中登录 QQ 空间。")
                                  .setPositiveButton("知道了", null).show();
                          } else {
                              startDownload(cookies);
                          }
                      });
                      
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      );
                      params.gravity = Gravity.BOTTOM | Gravity.END;
                      params.bottomMargin = 100;
                      params.rightMargin = 50;
                      
                      layout.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      ));
                      layout.addView(btn, params);
                      setContentView(layout);
                      
                  } catch (Throwable e) {
                      TextView tv = new TextView(this);
                      tv.setText("出错啦：\n" + e.toString());
                      tv.setPadding(40, 40, 40, 40);
                      setContentView(tv);
                  }
              }

              private void startDownload(final String cookies) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String uin = "";
                              String pSkey = "";
                              for (String c : cookies.split(";")) {
                                  if (c.trim().startsWith("uin=")) uin = c.trim().split("=")[1];
                                  if (c.trim().startsWith("p_skey=")) pSkey = c.trim().split("=")[1];
                              }
                              if (uin.startsWith("o")) uin = uin.substring(1);
                              if (uin.isEmpty() || pSkey.isEmpty()) {
                                  showResult("解析失败", "无法从 Cookie 中提取 uin 或 p_skey");
                                  return;
                              }

                              int hash = 5381;
                              for (char c : pSkey.toCharArray()) { hash += (hash << 5) + c; }
                              String gTk = String.valueOf(hash & 0x7fffffff);

                              String albumUrl = "https://h5.qzone.qq.com/proxy/domain/photo.qzone.qq.com/fcgi-bin/fcg_list_album_v3" +
                                      "?g_tk=" + gTk + "&uin=" + uin + "&hostUin=" + uin + "&format=json" +
                                      "&inCharset=utf-8&outCharset=utf-8&notice=0&platform=qzone&needNewCode=0&appid=4&pageNum=0&pageSize=100";

                              String albumResult = httpGet(albumUrl, cookies, uin);
                              JSONObject albumJson = new JSONObject(albumResult);
                              
                              // ★★★ 修复点：使用正确的键名 albumListModeSort ★★★
                              JSONArray albumList = albumJson.getJSONObject("data").getJSONArray("albumListModeSort");

                              int totalAlbums = albumList.length();
                              for (int i = 0; i < totalAlbums; i++) {
                                  JSONObject album = albumList.getJSONObject(i);
                                  String albumId = album.getString("id");
                                  String albumName = album.getString("name");
                                  
                                  final int current = i + 1;
                                  runOnUiThread(() -> {
                                      new AlertDialog.Builder(MainActivity.this)
                                          .setTitle("正在下载")
                                          .setMessage("进度：" + current + "/" + totalAlbums + "\n当前相册：" + albumName)
                                          .setPositiveButton("后台继续", null).show();
                                  });

                                  downloadAlbumPhotos(uin, gTk, cookies, albumId, albumName);
                              }
                              showResult("全部下载完成", "所有相册已成功保存到系统相册的 QzoneDownload 文件夹下。");
                          } catch (final Exception e) {
                              showResult("下载失败", e.toString());
                          }
                      }
                  }).start();
              }

              private void downloadAlbumPhotos(String uin, String gTk, String cookies, String albumId, String albumName) throws Exception {
                  String photoUrl = "https://h5.qzone.qq.com/proxy/domain/photo.qzone.qq.com/fcgi-bin/cgi_list_photo" +
                          "?g_tk=" + gTk + "&uin=" + uin + "&hostUin=" + uin + "&format=json" +
                          "&inCharset=utf-8&outCharset=utf-8&notice=0&platform=qzone&needNewCode=0" +
                          "&topicId=" + albumId + "&pageStart=0&count=500&mode=0&callback=shine0_Callback";

                  String photoResult = httpGet(photoUrl, cookies, uin);
                  
                  int startIndex = photoResult.indexOf("(");
                  int endIndex = photoResult.lastIndexOf(")");
                  if (startIndex != -1 && endIndex != -1 && endIndex > startIndex) {
                      photoResult = photoResult.substring(startIndex + 1, endIndex);
                  }
                  
                  JSONObject photoJson = new JSONObject(photoResult);
                  JSONArray photoList = photoJson.getJSONObject("data").getJSONArray("photoList");

                  for (int j = 0; j < photoList.length(); j++) {
                      JSONObject photo = photoList.getJSONObject(j);
                      String rawUrl = photo.getString("raw");
                      String fileName = "photo_" + j + ".jpg";
                      
                      byte[] imageData = httpGetBytes(rawUrl, cookies, uin);
                      saveToMediaStore(imageData, fileName, albumName);
                  }
              }

              private String httpGet(String urlStr, String cookies, String uin) throws Exception {
                  URL url = new URL(urlStr);
                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                  conn.setRequestMethod("GET");
                  conn.setRequestProperty("Cookie", cookies);
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Mobile Safari/537.36");
                  conn.setRequestProperty("Referer", "https://user.qzone.qq.com/" + uin);
                  conn.connect();
                  InputStream is = conn.getInputStream();
                  BufferedReader reader = new BufferedReader(new InputStreamReader(is));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = reader.readLine()) != null) { sb.append(line); }
                  return sb.toString();
              }

              private byte[] httpGetBytes(String urlStr, String cookies, String uin) throws Exception {
                  URL url = new URL(urlStr);
                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                  conn.setRequestMethod("GET");
                  conn.setRequestProperty("Cookie", cookies);
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Mobile Safari/537.36");
                  conn.setRequestProperty("Referer", "https://user.qzone.qq.com/" + uin);
                  conn.connect();
                  InputStream is = conn.getInputStream();
                  java.io.ByteArrayOutputStream baos = new java.io.ByteArrayOutputStream();
                  byte[] buffer = new byte[4096];
                  int len;
                  while ((len = is.read(buffer)) != -1) { baos.write(buffer, 0, len); }
                  return baos.toByteArray();
              }

              private void saveToMediaStore(byte[] data, String fileName, String albumName) {
                  try {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Images.Media.DISPLAY_NAME, fileName);
                      values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                      values.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/QzoneDownload/" + albumName);
                      Uri uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                      if (uri != null) {
                          OutputStream os = getContentResolver().openOutputStream(uri);
                          os.write(data);
                          os.close();
                      }
                  } catch (Exception e) {
                      // 忽略单张图片保存失败
                  }
              }

              private void showResult(final String title, final String msg) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle(title)
                              .setMessage(msg)
                              .setPositiveButton("关闭", null).show();
                      }
                  });
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk