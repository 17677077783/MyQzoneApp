name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android Project Files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/example/myqzoneapp
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          rootProject.name = "MyQzoneApp"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myqzoneapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myqzoneapp"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
              <application android:label="MyQzoneApp" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/myqzoneapp/MainActivity.java
          package com.example.myqzoneapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.Gravity;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      FrameLayout layout = new FrameLayout(this);
                      
                      webView = new WebView(this);
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setUserAgentString("Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Mobile Safari/537.36");
                      
                      webView.setWebViewClient(new WebViewClient());
                      webView.loadUrl("https://user.qzone.qq.com/");
                      
                      Button btn = new Button(this);
                      btn.setText("获取相册列表");
                      btn.setAlpha(0.8f);
                      btn.setOnClickListener(v -> {
                          String cookies = CookieManager.getInstance().getCookie("https://user.qzone.qq.com");
                          if (cookies == null || !cookies.contains("p_skey")) {
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("未登录")
                                  .setMessage("请先在上方网页中登录 QQ 空间。")
                                  .setPositiveButton("知道了", null).show();
                          } else {
                              fetchAlbumList(cookies);
                          }
                      });
                      
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      );
                      params.gravity = Gravity.BOTTOM | Gravity.END;
                      params.bottomMargin = 100;
                      params.rightMargin = 50;
                      
                      layout.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      ));
                      layout.addView(btn, params);
                      setContentView(layout);
                      
                  } catch (Throwable e) {
                      TextView tv = new TextView(this);
                      tv.setText("出错啦：\n" + e.toString());
                      tv.setPadding(40, 40, 40, 40);
                      setContentView(tv);
                  }
              }

              private void fetchAlbumList(final String cookies) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String uin = "";
                              String pSkey = "";
                              for (String c : cookies.split(";")) {
                                  if (c.trim().startsWith("uin=")) uin = c.trim().split("=")[1];
                                  if (c.trim().startsWith("p_skey=")) pSkey = c.trim().split("=")[1];
                              }
                              
                              if (uin.isEmpty() || pSkey.isEmpty()) {
                                  showResult("解析失败", "无法从 Cookie 中提取 uin 或 p_skey");
                                  return;
                              }

                              // 计算 g_tk
                              int hash = 5381;
                              for (char c : pSkey.toCharArray()) {
                                  hash += (hash << 5) + c;
                              }
                              String gTk = String.valueOf(hash & 0x7fffffff);

                              String urlStr = "https://h5.qzone.qq.com/proxy/domain/photo.qzone.qq.com/fcgi-bin/fcg_list_album_v3" +
                                      "?g_tk=" + gTk + "&uin=" + uin + "&hostUin=" + uin + "&format=json" +
                                      "&inCharset=utf-8&outCharset=utf-8&notice=0&platform=qzone&needNewCode=0&appid=4&pageNum=0&pageSize=100";

                              URL url = new URL(urlStr);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestMethod("GET");
                              conn.setRequestProperty("Cookie", cookies);
                              conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10)");
                              conn.connect();

                              InputStream is = conn.getInputStream();
                              BufferedReader reader = new BufferedReader(new InputStreamReader(is));
                              StringBuilder sb = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) { sb.append(line); }
                              final String result = sb.toString();
                              
                              showResult("接口返回数据", result.substring(0, Math.min(result.length(), 2000)));
                              
                          } catch (final Exception e) {
                              showResult("请求失败", e.toString());
                          }
                      }
                  }).start();
              }

              private void showResult(final String title, final String msg) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          new AlertDialog.Builder(MainActivity.this)
                              .setTitle(title)
                              .setMessage(msg)
                              .setPositiveButton("关闭", null).show();
                      }
                  });
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk