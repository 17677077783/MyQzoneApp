name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android Project Files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/example/myqzoneapp
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          rootProject.name = "MyQzoneApp"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myqzoneapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myqzoneapp"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
              <application android:label="MyQzoneApp" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/myqzoneapp/MainActivity.java
          package com.example.myqzoneapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.Gravity;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      FrameLayout layout = new FrameLayout(this);
                      
                      webView = new WebView(this);
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setUserAgentString("Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Mobile Safari/537.36");
                      
                      webView.setWebViewClient(new WebViewClient());
                      webView.loadUrl("https://user.qzone.qq.com/");
                      
                      // 注入 JS 桥接，用于接收网页抓取到的图片链接
                      webView.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void onImagesFound(final String jsonUrls) {
                              runOnUiThread(() -> {
                                  try {
                                      org.json.JSONArray arr = new org.json.JSONArray(jsonUrls);
                                      if (arr.length() == 0) {
                                          new AlertDialog.Builder(MainActivity.this)
                                              .setTitle("提示")
                                              .setMessage("当前页面没有检测到图片，请点击进入相册详情页后再试。")
                                              .setPositiveButton("知道了", null).show();
                                          return;
                                      }
                                      
                                      new AlertDialog.Builder(MainActivity.this)
                                          .setTitle("开始下载")
                                          .setMessage("检测到 " + arr.length() + " 张原图，正在后台下载...")
                                          .setPositiveButton("开始", (d, w) -> downloadImagesInBackground(arr)).show();
                                  } catch (Exception e) {
                                      e.printStackTrace();
                                  }
                              });
                          }
                      }, "AndroidBridge");
                      
                      Button btn = new Button(this);
                      btn.setText("一键下载本相册图片");
                      btn.setAlpha(0.8f);
                      btn.setOnClickListener(v -> {
                          // 利用网页自身的能力去抓取图片，绕过所有接口风控
                          String jsCode = "javascript:(function(){" +
                                  "var imgs = document.querySelectorAll('img');" +
                                  "var urls = [];" +
                                  "for (var i = 0; i < imgs.length; i++) {" +
                                  "  var src = imgs[i].src || imgs[i].getAttribute('data-src');" +
                                  "  if (src && src.indexOf('photo.store.qq.com') > -1 && urls.indexOf(src) === -1) {" +
                                  "    urls.push(src.replace(/\\/psc\\//, '/psc/').replace(/&ek=1/g, '').replace(/&sce=0-12-12/g, ''));" +
                                  "  }" +
                                  "}" +
                                  "AndroidBridge.onImagesFound(JSON.stringify(urls));" +
                                  "})();";
                          webView.loadUrl(jsCode);
                      });
                      
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      );
                      params.gravity = Gravity.BOTTOM | Gravity.END;
                      params.bottomMargin = 100;
                      params.rightMargin = 50;
                      
                      layout.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      ));
                      layout.addView(btn, params);
                      setContentView(layout);
                      
                  } catch (Throwable e) {
                      TextView tv = new TextView(this);
                      tv.setText("出错啦：\n" + e.toString());
                      tv.setPadding(40, 40, 40, 40);
                      setContentView(tv);
                  }
              }

              private void downloadImagesInBackground(org.json.JSONArray urls) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          int success = 0;
                          for (int i = 0; i < urls.length(); i++) {
                              try {
                                  String imgUrl = urls.getString(i);
                                  // 下载图片
                                  URL url = new URL(imgUrl);
                                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10)");
                                  conn.setRequestProperty("Referer", "https://user.qzone.qq.com/");
                                  java.io.InputStream is = conn.getInputStream();
                                  java.io.ByteArrayOutputStream baos = new java.io.ByteArrayOutputStream();
                                  byte[] buffer = new byte[4096];
                                  int len;
                                  while ((len = is.read(buffer)) != -1) { baos.write(buffer, 0, len); }
                                  byte[] data = baos.toByteArray();
                                  
                                  // 保存到手机相册
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.Images.Media.DISPLAY_NAME, "qzone_" + System.currentTimeMillis() + "_" + i + ".jpg");
                                  values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                                  values.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/QzoneDownload");
                                  Uri uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                                  if (uri != null) {
                                      OutputStream os = getContentResolver().openOutputStream(uri);
                                      os.write(data);
                                      os.close();
                                      success++;
                                  }
                                  Thread.sleep(300); // 稍微歇一下，模拟人工操作
                              } catch (Exception ignored) {}
                          }
                          final int finalSuccess = success;
                          runOnUiThread(() -> {
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("下载完成")
                                  .setMessage("成功保存 " + finalSuccess + " 张图片到相册的 QzoneDownload 文件夹。")
                                  .setPositiveButton("好", null).show();
                          });
                      }
                  }).start();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk