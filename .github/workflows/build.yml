name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android Project Files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/example/myqzoneapp
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          rootProject.name = "MyQzoneApp"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myqzoneapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myqzoneapp"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
              <application android:label="MyQzoneApp" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/myqzoneapp/MainActivity.java
          package com.example.myqzoneapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.Gravity;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      FrameLayout layout = new FrameLayout(this);
                      
                      webView = new WebView(this);
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setUserAgentString("Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Mobile Safari/537.36");
                      
                      webView.setWebViewClient(new WebViewClient());
                      webView.loadUrl("https://user.qzone.qq.com/");
                      
                      Button btn = new Button(this);
                      btn.setText("获取登录凭证");
                      btn.setAlpha(0.8f);
                      btn.setOnClickListener(v -> {
                          String cookies = CookieManager.getInstance().getCookie("https://user.qzone.qq.com");
                          if (cookies == null || !cookies.contains("p_skey")) {
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("未登录")
                                  .setMessage("请先在上方网页中登录 QQ 空间。")
                                  .setPositiveButton("知道了", null).show();
                          } else {
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("获取成功")
                                  .setMessage("请复制以下全部文字发送给我：\n\n" + cookies)
                                  .setPositiveButton("关闭", null).show();
                          }
                      });
                      
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      );
                      params.gravity = Gravity.BOTTOM | Gravity.END;
                      params.bottomMargin = 100;
                      params.rightMargin = 50;
                      
                      layout.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      ));
                      layout.addView(btn, params);
                      setContentView(layout);
                      
                  } catch (Throwable e) {
                      TextView tv = new TextView(this);
                      tv.setText("出错啦：\n" + e.toString());
                      tv.setPadding(40, 40, 40, 40);
                      setContentView(tv);
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk