name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android Project Files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/example/myqzoneapp
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          rootProject.name = "MyQzoneApp"
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.myqzoneapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.myqzoneapp"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
              <application android:label="MyQzoneApp" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/myqzoneapp/MainActivity.java
          package com.example.myqzoneapp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.view.Gravity;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      FrameLayout layout = new FrameLayout(this);
                      
                      webView = new WebView(this);
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true); // 开启本地存储
                      settings.setDatabaseEnabled(true);   // 开启数据库
                      settings.setUserAgentString("Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.0.0 Mobile Safari/537.36");
                      
                      // ★★★ 核心修复：开启 Cookie 持久化存储 ★★★
                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(webView, true); // 允许第三方 Cookie
                      
                      webView.setWebViewClient(new WebViewClient());
                      webView.loadUrl("https://user.qzone.qq.com/");
                      
                      webView.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void onMediaFound(final String jsonUrls) {
                              runOnUiThread(() -> {
                                  try {
                                      org.json.JSONArray arr = new org.json.JSONArray(jsonUrls);
                                      if (arr.length() == 0) {
                                          new AlertDialog.Builder(MainActivity.this)
                                              .setTitle("提示")
                                              .setMessage("未能获取到媒体文件，可能是相册为空或被腾讯风控拦截。")
                                              .setPositiveButton("知道了", null).show();
                                          return;
                                      }
                                      
                                      new AlertDialog.Builder(MainActivity.this)
                                          .setTitle("开始下载")
                                          .setMessage("检测到 " + arr.length() + " 个媒体文件，正在后台下载...")
                                          .setPositiveButton("开始", (d, w) -> downloadMediaInBackground(arr)).show();
                                  } catch (Exception e) {
                                      e.printStackTrace();
                                  }
                              });
                          }
                          
                          @JavascriptInterface
                          public void onError(final String errorMsg) {
                              runOnUiThread(() -> {
                                  new AlertDialog.Builder(MainActivity.this)
                                      .setTitle("获取失败")
                                      .setMessage(errorMsg)
                                      .setPositiveButton("知道了", null).show();
                              });
                          }
                      }, "AndroidBridge");
                      
                      Button btn = new Button(this);
                      btn.setText("一键全量下载本相册");
                      btn.setAlpha(0.8f);
                      btn.setOnClickListener(v -> {
                          String jsCode = "javascript:(function(){" +
                                  "var topicId = null;" +
                                  "var href = window.location.href;" +
                                  "var match = href.match(/\\/(?:album|list|photo)\\/([a-zA-Z0-9]+)/) || href.match(/[?&]id=([a-zA-Z0-9]+)/);" +
                                  "if (match) { topicId = match[1]; }" +
                                  "if (!topicId) {" +
                                  "  var html = document.body.innerHTML;" +
                                  "  var idMatch = html.match(/\"topicId\"\\s*:\\s*\"([a-zA-Z0-9]+)\"/) || html.match(/\"albumId\"\\s*:\\s*\"([a-zA-Z0-9]+)\"/);" +
                                  "  if (idMatch) { topicId = idMatch[1]; }" +
                                  "}" +
                                  "if (!topicId) { AndroidBridge.onError('无法识别当前相册，请确认已经点进了某个相册里面，再点下载按钮！'); return; }" +
                                  "var cookies = document.cookie;" +
                                  "var uinMatch = cookies.match(/uin=o?(\\d+)/);" +
                                  "var uin = uinMatch ? uinMatch[1] : '';" +
                                  "var pSkeyMatch = cookies.match(/p_skey=([^;]+)/);" +
                                  "var pSkey = pSkeyMatch ? pSkeyMatch[1] : '';" +
                                  "var g_tk = 5381;" +
                                  "for (var i = 0; i < pSkey.length; i++) { g_tk += (g_tk << 5) + pSkey.charCodeAt(i); }" +
                                  "g_tk = g_tk & 0x7fffffff;" +
                                  "var apiUrl = 'https://h5.qzone.qq.com/proxy/domain/photo.qzone.qq.com/fcgi-bin/cgi_list_photo?g_tk=' + g_tk + '&uin=' + uin + '&hostUin=' + uin + '&format=json&inCharset=utf-8&outCharset=utf-8&notice=0&platform=qzone&needNewCode=0&topicId=' + topicId + '&pageStart=0&count=500&mode=0';" +
                                  "fetch(apiUrl).then(function(res) { return res.text(); }).then(function(data) {" +
                                  "  var start = data.indexOf('(');" +
                                  "  var end = data.lastIndexOf(')');" +
                                  "  var jsonStr = (start !== -1 && end !== -1) ? data.substring(start + 1, end) : data;" +
                                  "  var json = JSON.parse(jsonStr);" +
                                  "  if (!json.data || !json.data.photoList) { AndroidBridge.onError('接口未返回照片列表，可能相册为空。'); return; }" +
                                  "  var photoList = json.data.photoList;" +
                                  "  var urls = [];" +
                                  "  for (var i = 0; i < photoList.length; i++) {" +
                                  "    var photo = photoList[i];" +
                                  "    if (photo.raw) urls.push(photo.raw);" +
                                  "    if (photo.video && photo.video.url) urls.push(photo.video.url);" +
                                  "  }" +
                                  "  AndroidBridge.onMediaFound(JSON.stringify(urls));" +
                                  "}).catch(function(err) { AndroidBridge.onError('请求失败：' + err.toString()); });" +
                                  "})();";
                          webView.loadUrl(jsCode);
                      });
                      
                      FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      );
                      params.gravity = Gravity.BOTTOM | Gravity.END;
                      params.bottomMargin = 100;
                      params.rightMargin = 50;
                      
                      layout.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      ));
                      layout.addView(btn, params);
                      setContentView(layout);
                      
                  } catch (Throwable e) {
                      TextView tv = new TextView(this);
                      tv.setText("出错啦：\n" + e.toString());
                      tv.setPadding(40, 40, 40, 40);
                      setContentView(tv);
                  }
              }

              // ★★★ 核心修复：在 App 退出时，把 Cookie 强行刷入手机磁盘 ★★★
              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  CookieManager.getInstance().flush();
              }

              private void downloadMediaInBackground(org.json.JSONArray urls) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          int imgSuccess = 0;
                          int vidSuccess = 0;
                          for (int i = 0; i < urls.length(); i++) {
                              try {
                                  String urlStr = urls.getString(i);
                                  boolean isVideo = urlStr.contains(".mp4") || urlStr.contains("video.qzone.qq.com");
                                  
                                  URL url = new URL(urlStr);
                                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10)");
                                  conn.setRequestProperty("Referer", "https://user.qzone.qq.com/");
                                  java.io.InputStream is = conn.getInputStream();
                                  java.io.ByteArrayOutputStream baos = new java.io.ByteArrayOutputStream();
                                  byte[] buffer = new byte[4096];
                                  int len;
                                  while ((len = is.read(buffer)) != -1) { baos.write(buffer, 0, len); }
                                  byte[] data = baos.toByteArray();
                                  
                                  ContentValues values = new ContentValues();
                                  Uri uri;
                                  
                                  if (isVideo) {
                                      values.put(MediaStore.Video.Media.DISPLAY_NAME, "qzone_video_" + System.currentTimeMillis() + "_" + i + ".mp4");
                                      values.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4");
                                      values.put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/QzoneDownload");
                                      uri = getContentResolver().insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values);
                                  } else {
                                      values.put(MediaStore.Images.Media.DISPLAY_NAME, "qzone_img_" + System.currentTimeMillis() + "_" + i + ".jpg");
                                      values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                                      values.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/QzoneDownload");
                                      uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                                  }
                                  
                                  if (uri != null) {
                                      OutputStream os = getContentResolver().openOutputStream(uri);
                                      os.write(data);
                                      os.close();
                                      if (isVideo) vidSuccess++; else imgSuccess++;
                                  }
                                  Thread.sleep(200);
                              } catch (Exception ignored) {}
                          }
                          final int finalImg = imgSuccess;
                          final int finalVid = vidSuccess;
                          runOnUiThread(() -> {
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("下载完成")
                                  .setMessage("成功保存图片 " + finalImg + " 张，视频 " + finalVid + " 个。\n请在手机相册/图库中查看 QzoneDownload 文件夹。")
                                  .setPositiveButton("好", null).show();
                          });
                      }
                  }).start();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk